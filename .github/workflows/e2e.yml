---
# Browser e2e (tenancy leak tests and later suites): starts Postgres, Redis, Temporal and the
# app, then runs the Playwright suite in e2e/. A failing test fails the job.
name: E2E

# Not on push: it rebuilds the whole app and does not gate the deploy.
on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      # Worker role (migrations, orchestrator) and API role (backend), as in production
      DATABASE_WORKER_URL: postgresql://e2e:e2e@localhost:5432/e2e
      APP_DB_USER: app_api
      APP_DB_PASSWORD: app_api_e2e
      DATABASE_URL: postgresql://app_api:app_api_e2e@localhost:5432/e2e
      REDIS_URL: redis://localhost:6379
      TEMPORAL_ADDRESS: 127.0.0.1:7233
      JWT_SECRET: e2e-only-jwt-secret-not-used-anywhere-else
      FRONTEND_URL: http://localhost:4200
      NEXT_PUBLIC_BACKEND_URL: http://localhost:3000
      BACKEND_INTERNAL_URL: http://localhost:3000
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: ${{ github.workspace }}/tmp/e2e/uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      IS_GENERAL: 'true'
      E2E_BASE_URL: http://localhost:4200
      # Sign-in codes are written to the backend log, which the tests read (the log mail provider is
      # refused in production, never here)
      EMAIL_PROVIDER: log
      EMAIL_FROM_NAME: E2E
      EMAIL_FROM_ADDRESS: e2e@e2e.test
      OTP_RESEND_COOLDOWN_SECONDS: '0'
      OTP_REQUEST_LIMIT: '1000'
      E2E_BACKEND_LOG: ${{ github.workspace }}/tmp/e2e/logs/backend.log

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start Temporal
        run: |
          docker run -d --name temporal --network host \
            -e DB=postgres12 -e DB_PORT=5432 -e POSTGRES_SEEDS=127.0.0.1 \
            -e POSTGRES_USER=e2e -e POSTGRES_PWD=e2e \
            -e ENABLE_ES=false -e VISIBILITY_DBNAME=temporal_visibility -e NUM_HISTORY_SHARDS=4 \
            -e SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES=true \
            -e BIND_ON_IP=127.0.0.1 -e TEMPORAL_BROADCAST_ADDRESS=127.0.0.1 \
            -e DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/production-sql.yaml \
            -v "$PWD/dynamicconfig:/etc/temporal/config/dynamicconfig:ro" \
            temporalio/auto-setup:1.28.1

      - name: Migrate the database and create the API role
        run: |
          DATABASE_URL="$DATABASE_WORKER_URL" pnpm run prisma-migrate-deploy
          sh libraries/nestjs-libraries/src/database/prisma/credits/scope/money-roles.sh

      - name: Build
        run: |
          pnpm run build:backend
          pnpm run build:orchestrator
          pnpm run build:frontend

      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Start the app
        run: |
          mkdir -p tmp/e2e/logs "$UPLOAD_DIRECTORY"
          timeout 180 bash -c 'until (echo > /dev/tcp/127.0.0.1/7233) 2>/dev/null; do sleep 2; done'
          nohup pnpm run start:prod:backend > tmp/e2e/logs/backend.log 2>&1 &
          nohup pnpm run start:prod:orchestrator > tmp/e2e/logs/orchestrator.log 2>&1 &
          nohup pnpm run start:prod:frontend > tmp/e2e/logs/frontend.log 2>&1 &
          timeout 300 sh -c 'until curl -sf http://localhost:3000/ > /dev/null; do sleep 3; done'
          timeout 300 sh -c 'until curl -sf http://localhost:4200/auth/login > /dev/null; do sleep 3; done'

      - name: Run the e2e suite
        run: pnpm run e2e

      - name: Keep the report and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            tmp/e2e/report
            tmp/e2e/test-results
            tmp/e2e/logs
          retention-days: 7
