---
name: Build image

# The VPS only pulls images. It never builds: the Next.js build needs more
# memory than the 2 GB production box has.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # A newer push replaces a build still running. Only the build: a deploy that has started always finishes (its own
    # group below), because stopping it half way could leave a migration half applied.
    concurrency:
      group: build-image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.dev
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: NEXT_PUBLIC_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          
  # The e2e suite (e2e.yml) runs beside the image build; it builds the app from source, so it does not wait for the image.
  e2e:
    uses: ./.github/workflows/e2e.yml

  # Only when both the image build and the e2e suite passed: a failing test never reaches production.
  deploy:
    needs: [build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy on the VPS
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 10 "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          # The key's entry in the VPS ~/.ssh/authorized_keys is a forced command (restrict) that runs only
          # deploy/scripts/remote-deploy.sh <tier>: it moves the server's checkout to this commit and deploys the image
          # built above (tag sha-<7 chars>). It reads nothing from this request but "deploy <commit sha>".
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
              -o ServerAliveInterval=30 "${DEPLOY_USER:?set the repository variable DEPLOY_USER}@$DEPLOY_HOST" \
              "deploy $GITHUB_SHA"

      # Through the public domain (DNS, TLS, the edge proxy and the app together), not only inside the container.
      - name: Check the site answers
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${DEPLOY_URL:?set the repository variable DEPLOY_URL}/api/" || true)
            [ "$code" = 200 ] && { echo "$DEPLOY_URL/api/ answered 200"; exit 0; }
            echo "attempt $attempt: $code"; sleep 10
          done
          echo "::error::$DEPLOY_URL/api/ did not answer 200 after the deploy"; exit 1
