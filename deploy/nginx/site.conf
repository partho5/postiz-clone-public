# Host nginx site for HOST_NGINX=1 (see deploy/host-nginx.yaml). __DOMAIN__ and __APP_HOST_PORT__ are replaced when it is
# installed into /etc/nginx/sites-available/__DOMAIN__; then certbot --nginx -d __DOMAIN__ --redirect adds the 443 server
# and the redirect from 80. Same settings as the first production server (social.nanybot.com).
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 128M;

    location / {
        proxy_pass http://127.0.0.1:__APP_HOST_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    access_log /var/log/nginx/__DOMAIN__-access.log;
    error_log  /var/log/nginx/__DOMAIN__-error.log;
}
