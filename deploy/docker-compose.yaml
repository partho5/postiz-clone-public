# Production stack sized for a small VPS.
#
# Every memory knob comes from a tier file, so moving from 2 GB to 4 GB or 8 GB
# is a config change only. Deploy with deploy/scripts/deploy.sh <tier>, which
# pulls the image, migrates and then runs:
#   docker compose -f deploy/docker-compose.yaml --env-file deploy/tiers/2gb.env --env-file deploy/.env up -d
# deploy/.env (from deploy/env.example) is the one operator file: compose reads it
# for the ${...} values below and the app container reads it as its environment.
#
# The app image is built in CI (.github/workflows/build-image.yml). Never build
# on the VPS: the Next.js build alone needs more RAM than a 2 GB box has.
#
# Optional profiles:
#   ops -> temporal-ui and admin tools, start on demand, stop when done
#   es  -> Elasticsearch visibility for Temporal (8 GB tier only)

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/partho5/postiz-clone-public:latest}
    container_name: app
    restart: always
    env_file: .env
    environment:
      # The backend uses the API role (row-level security on the money
      # tables); the orchestrator and migrations use the worker role.
      DATABASE_URL: 'postgresql://${APP_DB_USER}:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?connection_limit=${PRISMA_CONNECTION_LIMIT}'
      DATABASE_WORKER_URL: 'postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connection_limit=${PRISMA_CONNECTION_LIMIT}'
      # Read by deploy/scripts/migrate.sh to create the API role
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      REDIS_URL: 'redis://redis:6379'
      TEMPORAL_ADDRESS: 'temporal:7233'
      BACKEND_INTERNAL_URL: 'http://localhost:3000'
      # Per-process V8 heap caps, read by each app's pm2 script
      BACKEND_HEAP_MB: ${BACKEND_HEAP_MB}
      ORCHESTRATOR_HEAP_MB: ${ORCHESTRATOR_HEAP_MB}
      FRONTEND_HEAP_MB: ${FRONTEND_HEAP_MB}
    mem_limit: ${APP_MEM_LIMIT}
    volumes:
      - uploads:/uploads/
      - app-config:/config/
    expose:
      - 5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    logging: *logging

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TEMPORAL_DB_USER: ${TEMPORAL_DB_USER}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE}
      - -c
      - work_mem=${PG_WORK_MEM}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS}
    mem_limit: ${PG_MEM_LIMIT}
    shm_size: 128m
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-temporal.sh:/docker-entrypoint-initdb.d/10-init-temporal.sh:ro
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    # volatile-lru: only keys with a TTL (throttler, caches) can be evicted.
    # Locks and idempotency records always carry a TTL and are sized small.
    command: >
      redis-server
      --maxmemory ${REDIS_MAXMEMORY}
      --maxmemory-policy volatile-lru
      --appendonly yes
    mem_limit: ${REDIS_MEM_LIMIT}
    volumes:
      - redis-data:/data
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  temporal:
    image: temporalio/auto-setup:1.28.1
    container_name: temporal
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_SEEDS=postgres
      - POSTGRES_USER=${TEMPORAL_DB_USER}
      - POSTGRES_PWD=${TEMPORAL_DB_PASSWORD}
      - DBNAME=temporal
      # SQL advanced visibility on the same Postgres: same search features as
      # Elasticsearch, no JVM. Set ENABLE_ES=true + profile "es" on 8 GB.
      - VISIBILITY_DBNAME=temporal_visibility
      - ENABLE_ES=${TEMPORAL_ENABLE_ES}
      - ES_SEEDS=temporal-elasticsearch
      - ES_VERSION=v7
      - NUM_HISTORY_SHARDS=${TEMPORAL_HISTORY_SHARDS}
      - SQL_MAX_CONNS=${TEMPORAL_SQL_MAX_CONNS}
      - GOMEMLIMIT=${TEMPORAL_GOMEMLIMIT}
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/production-sql.yaml
      - TEMPORAL_NAMESPACE=default
      # The sample search attributes auto-setup adds fill SQL visibility's 3 Text slots, and the
      # backend then cannot register its own.
      - SKIP_ADD_CUSTOM_SEARCH_ATTRIBUTES=true
    mem_limit: ${TEMPORAL_MEM_LIMIT}
    expose:
      - 7233
    volumes:
      - ../dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    logging: *logging

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: always
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      # Host ports; leave unset on a VPS (Let's Encrypt needs 80 and 443)
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
      - '${CADDY_HTTPS_PORT:-443}:443/udp'
    mem_limit: ${CADDY_MEM_LIMIT}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    logging: *logging

  # ---- on demand: docker compose --profile ops up -d temporal-ui ----------
  temporal-ui:
    profiles: ['ops']
    image: temporalio/ui:2.34.0
    container_name: temporal-ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    mem_limit: 128m
    # Bound to localhost only; reach it through an SSH tunnel.
    ports:
      - '127.0.0.1:8080:8080'

  temporal-admin-tools:
    profiles: ['ops']
    image: temporalio/admin-tools:1.28.1-tctl-1.18.4-cli-1.4.1
    container_name: temporal-admin-tools
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CLI_ADDRESS=temporal:7233
    stdin_open: true
    tty: true
    mem_limit: 128m

  # ---- 8 GB tier only: docker compose --profile es up -d ------------------
  temporal-elasticsearch:
    profiles: ['es']
    image: elasticsearch:7.17.27
    container_name: temporal-elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms${ES_HEAP} -Xmx${ES_HEAP}
      - xpack.security.enabled=false
    mem_limit: ${ES_MEM_LIMIT}
    expose:
      - 9200
    volumes:
      - es-data:/usr/share/elasticsearch/data

volumes:
  postgres-data:
  redis-data:
  uploads:
  app-config:
  caddy-data:
  caddy-config:
  es-data:
